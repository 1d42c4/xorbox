[package]
name = "xorbox"
version = "0.1.1"
edition = "2024"
rust-version = "1.98.1"
description = "A small, streaming file encryption CLI for Windows and Linux"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20 = { version = "0.10.1", features = ["zeroize"] }
ctrlc = "3.5.2"
dryoc = { version = "1.0.0", default-features = false }
getrandom = "0.4.3"
hex = "0.4.3"
rpassword = "7.5.4"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha3 = { version = "0.12.0", features = ["zeroize"] }
tempfile = "3.27.0"
zeroize = { version = "1.9.0", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_IO", "Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
